      operationId: api_roles_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this rol.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
          description: ''
    put:
      operationId: api_roles_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this rol.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Rol'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Rol'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Rol'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
          description: ''
    patch:
      operationId: api_roles_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this rol.
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedRol'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedRol'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedRol'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rol'
          description: ''
    delete:
      operationId: api_roles_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this rol.
        required: true
      tags:
      - api
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/token/refresh/:
    post:
      operationId: api_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
components:
  schemas:
    Ataque:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo:
          type: string
          maxLength: 100
        descripcion:
          type: string
          nullable: true
        ip_origen:
          type: string
          nullable: true
          maxLength: 45
        ip_destino:
          type: string
          nullable: true
          maxLength: 45
        puerto:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        fecha_detectado:
          type: string
          format: date-time
          readOnly: true
        conteo_conexiones:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        activo:
          type: boolean
      required:
      - fecha_detectado
      - id
      - tipo
    Conexion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hora:
          type: string
          format: date-time
        ip_src:
          type: string
          maxLength: 45
        ip_dst:
          type: string
          maxLength: 45
        port_dst:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        etiqueta:
          type: string
          maxLength: 50
        protocolo:
          type: string
          nullable: true
          maxLength: 10
      required:
      - etiqueta
      - hora
      - id
      - ip_dst
      - ip_src
    DashboardStats:
      type: object
      properties:
        ataques_activos:
          type: integer
        ataques_hoy:
          type: integer
        conexiones_hoy:
          type: integer
        mitigaciones_exitosas:
          type: integer
        ataques_ultimos_30_dias:
          type: integer
      required:
      - ataques_activos
      - ataques_hoy
      - ataques_ultimos_30_dias
      - conexiones_hoy
      - mitigaciones_exitosas
    ExportJson:
      type: object
      properties:
        ataques:
          type: array
          items:
            type: object
            additionalProperties: {}
        mitigaciones:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - ataques
      - mitigaciones
    LoginRequest:
      type: object
      properties:
        usuario:
          type: string
        contrasena:
          type: string
      required:
      - contrasena
      - usuario
    LoginResponse:
      type: object
      properties:
        refresh:
          type: string
        access:
          type: string
        usuario:
          type: string
        rol:
          type: string
          nullable: true
        message:
          type: string
      required:
      - access
      - message
      - refresh
      - rol
      - usuario
    Mitigacion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ataque:
          type: integer
        ip:
          type: string
          nullable: true
        detalle:
          type: string
          nullable: true
        ejecutado_por:
          type: integer
          nullable: true
        activo:
          type: boolean
        fecha_mitigacion:
          type: string
          format: date-time
          readOnly: true
        resultado:
          type: string
          nullable: true
          maxLength: 100
      required:
      - ataque
      - fecha_mitigacion
      - id
    PatchedAtaque:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        tipo:
          type: string
          maxLength: 100
        descripcion:
          type: string
          nullable: true
        ip_origen:
          type: string
          nullable: true
          maxLength: 45
        ip_destino:
          type: string
          nullable: true
          maxLength: 45
        puerto:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        fecha_detectado:
          type: string
          format: date-time
          readOnly: true
        conteo_conexiones:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        activo:
          type: boolean
    PatchedConexion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        hora:
          type: string
          format: date-time
        ip_src:
          type: string
          maxLength: 45
        ip_dst:
          type: string
          maxLength: 45
        port_dst:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        etiqueta:
          type: string
          maxLength: 50
        protocolo:
          type: string
          nullable: true
          maxLength: 10
    PatchedMitigacion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        ataque:
          type: integer
        ip:
          type: string
          nullable: true
        detalle:
          type: string
          nullable: true
        ejecutado_por:
          type: integer
          nullable: true
        activo:
          type: boolean
        fecha_mitigacion:
          type: string
          format: date-time
          readOnly: true
        resultado:
          type: string
          nullable: true
          maxLength: 100
    PatchedPersonal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        apellido:
          type: string
          maxLength: 100
        numero:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
        correo:
          type: string
          format: email
          maxLength: 254
        usuario:
          type: string
          maxLength: 50
        contrasena:
          type: string
          writeOnly: true
          maxLength: 20
          minLength: 8
        rol:
          type: integer
        activo:
          type: boolean
        fecha_registro:
          type: string
          format: date-time
          readOnly: true
    PatchedRol:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre_rol:
          type: string
          maxLength: 20
          minLength: 3
    Personal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre:
          type: string
          maxLength: 100
        apellido:
          type: string
          maxLength: 100
        numero:
          type: string
          format: decimal
          pattern: ^-?\d{0,20}(?:\.\d{0,0})?$
        correo:
          type: string
          format: email
          maxLength: 254
        usuario:
          type: string
          maxLength: 50
        contrasena:
          type: string
          writeOnly: true
          maxLength: 20
          minLength: 8
        rol:
          type: integer
        activo:
          type: boolean
        fecha_registro:
          type: string
          format: date-time
          readOnly: true
      required:
      - apellido
      - contrasena
      - correo
      - fecha_registro
      - id
      - nombre
      - numero
      - rol
      - usuario
    Rol:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nombre_rol:
          type: string
          maxLength: 20
          minLength: 3
      required:
      - id
      - nombre_rol
    TokenRefresh:
      type: object
      properties:
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          writeOnly: true
      required:
      - access
      - refresh
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
